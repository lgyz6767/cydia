name: ext-index

on:
  push:
    branches: [main]
    paths:
      - "ext/**"
      - "scripts/build_ext_index.py"
      - ".github/workflows/ext-index.yml"
  pull_request:
    paths:
      - "ext/**"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Build & validate ext/index.json
        run: python3 scripts/build_ext_index.py
      - name: Commit index
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ext/index.json
          git diff --cached --quiet || git commit -m "ext: 自动生成 index.json"
          git push
